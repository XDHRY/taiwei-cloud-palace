name: Asset Pack Catalog Integrity

on:
  push:
    branches: ["ai/asset-factory-v2"]
    paths:
      - "blender/asset-packs.json"
      - "blender/tools/generate_*asset_pack*.py"
      - "blender/tools/render_*asset_preview*.py"
      - "blender/tools/validate_asset_pack_catalog.py"
      - ".github/workflows/asset-pack-catalog-integrity.yml"
  pull_request:
    paths:
      - "blender/asset-packs.json"
      - "blender/tools/generate_*asset_pack*.py"
      - "blender/tools/render_*asset_preview*.py"
      - "blender/tools/validate_asset_pack_catalog.py"

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate asset-pack catalog
        run: python3 blender/tools/validate_asset_pack_catalog.py
