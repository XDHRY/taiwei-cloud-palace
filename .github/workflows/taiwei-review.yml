name: Taiwei Multi-angle Review

on:
  push:
    branches: [main, "ai/**"]
    paths:
      - "blender/src/**"
      - "blender/scripts-rebuild/**"
      - "assets/textures_wukong/**"
      - ".github/workflows/taiwei-review.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taiwei-review-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: "4.2.23"
  BLENDER_DIR: ${{ github.workspace }}/.cache/blender

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .cache/blender
          key: blender-linux-x64-${{ env.BLENDER_VERSION }}

      - name: Install Blender 4.2 LTS
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$BLENDER_DIR"
          curl --fail --location --retry 3 \
            "https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            -o "${RUNNER_TEMP}/blender.tar.xz"
          tar -xJf "${RUNNER_TEMP}/blender.tar.xz" --strip-components=1 -C "$BLENDER_DIR"

      - name: Install headless graphics runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libgl1-mesa-dri libxi6 libxxf86vm1 libxfixes3 libxrender1

      - name: Build fresh STUDY scene
        env:
          TAIWEI_QUALITY: STUDY
          TAIWEI_CLEAR: "1"
          TAIWEI_SAVE: "1"
          TAIWEI_OUTPUT_DIRECTORY: ${{ runner.temp }}/taiwei-review-build
          TAIWEI_PROJECT_FILENAME: TaiWei_CI_STUDY.blend
          TAIWEI_TEXTURE_DIR: ${{ github.workspace }}/assets/textures_wukong
        run: |
          set -euxo pipefail
          mkdir -p "$TAIWEI_OUTPUT_DIRECTORY"
          "$BLENDER_DIR/blender" --background --python-exit-code 1 \
            --python blender/src/taiwei_cloud_palace_generator.py
          test -s "$TAIWEI_OUTPUT_DIRECTORY/TaiWei_CI_STUDY.blend"

      - name: Render four review cameras
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: "surfaceless"
          TAIWEI_REVIEW_OUT: ${{ github.workspace }}/ci_artifacts/review
          TAIWEI_REVIEW_WIDTH: "560"
          TAIWEI_REVIEW_HEIGHT: "315"
        run: |
          set -euxo pipefail
          "$BLENDER_DIR/blender" --background \
            "${RUNNER_TEMP}/taiwei-review-build/TaiWei_CI_STUDY.blend" \
            --python-exit-code 1 \
            --python blender/scripts-rebuild/ci_render_review.py

      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taiwei-review-${{ github.sha }}
          path: ci_artifacts/review/
          if-no-files-found: error
          retention-days: 30
